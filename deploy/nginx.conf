# Install as /etc/nginx/conf.d/self.conf, then nginx -t && systemctl reload nginx.
server {
    listen 80;
    listen [::]:80;
    server_name self.canis.world;

    error_page 502 503 504 =503 /50x.html;
    location = /50x.html {
        root /home/self.canis.world/public;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
    }

    location / {
        proxy_pass http://localhost:7347;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors on;
    }

    location /static {
        root /home/self.canis.world/.next/static/;
    }
}
