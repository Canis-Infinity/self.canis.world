services:
  self:
    image: node:24-alpine
    container_name: self_canis_world
    working_dir: /app
    command: sh -c "npm ci --include=dev && npm run build && npm run start -- -H 0.0.0.0"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://host.docker.internal:7344}
    ports:
      - "${SELF_PORT:-7347}:7347"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - self_node_modules:/app/node_modules
      - self_next:/app/.next
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7347/login >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
volumes:
  self_node_modules:
  self_next:
